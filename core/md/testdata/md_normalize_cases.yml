cases:
  - name: list_image_indent_and_blank_line
    direction: write
    md_config:
      code_block_transforms: []
    input: |
      1. item one
         ![img](a.png)
      2. item two
         ![img](b.png)
      3. item three
         text text
      4. item four
    expected: |
      1. item one

          ![img](a.png)

      2. item two

          ![img](b.png)

      3. item three

          text text

      4. item four

  - name: codeblock_transform_write
    direction: write
    md_config:
      code_block_transforms:
        - from_lang: bash
          to_lang: sh
          direction: write
          enabled: true
    input: |
      ```bash
      echo hi
      ```
    expected: |
      ```sh
      echo hi
      ```

  - name: list_dedented_paragraph_not_in_list
    direction: write
    md_config:
      code_block_transforms: []
    input: |
      * list 1
          list 1 content

      Content not belongs to list item
    expected: |
      * list 1

          list 1 content

      Content not belongs to list item

  - name: no_change_when_read
    direction: read
    md_config:
      code_block_transforms: []
    input: |
      1. item one
