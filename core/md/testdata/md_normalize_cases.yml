  - name: jep_512_513_sample
    direction: write
    md_config:
      code_block_transforms: []
    input: |
      * Grouping import declarations
  
        If a source file has a mix of different kinds of import declarations then grouping them by kind may further improve readability; for example:
        
        ```java
        // Module imports
        import module M1;
        import module M2;
        ...
        
        // Package imports
        import P1.*;
        import P2.*;
        ...
        
        // Single-type imports
        import P1.C1;
        import P2.C2;
        ...
        
        class Foo { ... }
        ```
  
      ### Compact Source Files and Instance Main Methods

      In https://openjdk.org/jeps/512.

      * Compact source files
        
        The following `main.java`,
        
        ```java
        public class Main {
            static void main(String [] args) {
                System.out.println("hello java");
            }
        }
        ```
        
        Can be simplified as the following `main.java`,
        
        ```java
        String greeting() { return "Hello, World!"; }
        
        void main(){
            IO.println(greeting() + " java 25");
        }
        ```
      * Interacting with the console
        
        A new class `java.lang.IO` to interact with IO, for example,
        
        * IO.println
        * IO.print
        * IO.readln
      * Automatic import of the `java.base` module
        
        * java.lang
        * java.io
        * java.util
        * java.time
        * java.text
        * java.net
        * java.math
        * java.security
        * java.nio
        * java.util.concurrent
        * java.util.function

      ### Flexible Constructor Bodies

      In https://openjdk.org/jeps/513.

      * A new model for constructor bodies
