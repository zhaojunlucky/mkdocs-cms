      2. item two

  - name: child_list_continuation
    direction: write
    md_config:
      code_block_transforms: []
    input: |
      1. parent
         - child a
           child a continuation
         - child b
           child b continuation
      2. next parent
    expected: |
      1. parent
          - child a

              child a continuation

          - child b

              child b continuation

      2. next parent

