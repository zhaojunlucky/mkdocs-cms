<nav class="docs-navbar" aria-label="Top Toolbar">
  <a matButton="text" routerLink="/home" aria-label="MkDocs CMS">
    MkDocs CMS
  </a>

  <div class="spacer"></div>

  @if (authService.isLoggedIn) {
    <button matIconButton [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      @if (authService.currentUser) {
        <div class="user-info">
          @if (authService.currentUser.avatar_url) {
            <div class="user-avatar">
              <img [src]="authService.currentUser.avatar_url" alt="User avatar">
            </div>
          }
          <div class="user-details">
            <p class="user-name">{{ authService.currentUser.name }}</p>
            <p class="user-email">{{ authService.currentUser.email }}</p>
          </div>
        </div>
      }
      @if (showReqNotifyBtn()) {
        <button mat-menu-item (click)="requestNotificationPermission()">
          <mat-icon>notifications</mat-icon>
          <span>Enable Notifications</span>
        </button>
      }
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  } @else {
    <a matIconButton routerLink="/login">
      <mat-icon>login</mat-icon>
    </a>
  }
</nav>
