
<div class="login-container">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header>
      <div mat-card-avatar class="login-avatar">
        <mat-icon>description</mat-icon>
      </div>
      <mat-card-title>Markdown CMS</mat-card-title>
      <mat-card-subtitle>Sign in to manage your content, repositories, and publishing workflows.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (loading) {
        <div class="loading-spinner">
          <mat-spinner diameter="40"></mat-spinner>
          <p>Authenticating...</p>
        </div>
      }

      @if (!loading) {
        <div class="login-actions">
          <button mat-flat-button color="primary" (click)="loginWithGithub()" class="login-button">
            <mat-icon>login</mat-icon>
            <span>Continue with GitHub</span>
          </button>
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
